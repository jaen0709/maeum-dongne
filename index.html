<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ef6c1a" />
  <meta name="description" content="우리 동네에서 '이거 같이 해볼래요?'로 시작하는 따뜻한 봉사 매칭. 참여를 기록하는 마음확인증까지." />
  <title>마음동네 · 동네 봉사 매칭</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="마음동네" />

  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="app">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <div class="app-header__inner">
        <h1 class="brand">마음<span>동네</span></h1>
        <div class="app-header__region" id="header-region">📍 연남동</div>
      </div>
    </header>

    <!-- 화면들이 이 안에 렌더링됨 -->
    <main id="view" class="view"></main>

    <!-- 봉사 올리기 FAB -->
    <button id="fab" class="fab" aria-label="봉사 올리기">＋</button>

    <!-- 하단 탭바 -->
    <nav class="tabbar" id="tabbar">
      <button class="tabbar__item is-active" data-tab="home">
        <span class="tabbar__icon">🔍</span>
        <span class="tabbar__label">찾기</span>
      </button>
      <button class="tabbar__item" data-tab="sarangbang">
        <span class="tabbar__icon">💬</span>
        <span class="tabbar__label">사랑방</span>
      </button>
      <button class="tabbar__item" data-tab="certs">
        <span class="tabbar__icon">🕯️</span>
        <span class="tabbar__label">확인증함</span>
        <span class="tabbar__badge" id="certs-badge" hidden>0</span>
      </button>
      <button class="tabbar__item" data-tab="me">
        <span class="tabbar__icon">🌱</span>
        <span class="tabbar__label">나</span>
        <span class="tabbar__badge" id="mine-badge" hidden>0</span>
      </button>
    </nav>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast" class="toast" hidden></div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // 서비스워커 등록 (오프라인 · 설치 지원)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
